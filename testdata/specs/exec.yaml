openapi: 3.0.3
info: { title: exec, version: "1" }
servers: [{ url: /api/v3 }]
security: [{ bearer: [] }]
paths:
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: integer }, example: 42 }
    put:
      operationId: updateBook
      parameters:
        - { name: tags, in: query, schema: { type: array, items: { type: string } }, example: [a, b] }
        - { name: X-Trace, in: header, schema: { type: string }, example: "t-1" }
        - { name: lang, in: cookie, schema: { type: string }, example: "de" }
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example: { title: "Go" }
      responses:
        '200':
          description: ok
          content: { application/json: { schema: { type: object } } }
  /missing/{id}:
    get:
      operationId: getMissing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
  /stats:
    get:
      operationId: getStats
      security: [{ key: [] }]
      responses: { '200': { description: ok } }
  /session:
    get:
      operationId: getSession
      security: [{ basic: [] }, { cookieKey: [] }]
      responses: { '200': { description: ok } }
  /basic:
    get:
      operationId: getBasic
      security: [{ basic: [] }]
      responses: { '200': { description: ok } }
  /oauth:
    get:
      operationId: getOAuth
      security: [{ oauth: [read] }, { oidc: [] }]
      responses: { '200': { description: ok } }
  /form:
    post:
      operationId: postForm
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
            example: { name: "a b", n: 1 }
      responses: { '201': { description: ok } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    key: { type: apiKey, in: query, name: api_key }
    cookieKey: { type: apiKey, in: cookie, name: sid }
    basic: { type: http, scheme: basic }
    oauth:
      type: oauth2
      flows: { clientCredentials: { tokenUrl: "http://idp/token", scopes: { read: r } } }
    oidc: { type: openIdConnect, openIdConnectUrl: "http://idp/.well-known/openid-configuration" }
