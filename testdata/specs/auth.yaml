openapi: 3.0.3
info: { title: auth, version: "1" }
security: [{ bearer: [] }]
paths:
  /items:
    post:
      tags: [Item]
      operationId: createItem
      x-apitest-forbidden: true
      requestBody:
        content: { application/json: { schema: { type: object }, example: { name: a } } }
      responses:
        '201': { description: ok }
        '401': { description: no token }
        '403': { description: not allowed }
  /items/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer }, example: 1 }]
    get:
      tags: [Item]
      operationId: openItem
      security: []
      responses: { '200': { description: ok }, '401': { description: never } }
    delete:
      tags: [Item]
      operationId: deleteItem
      x-apitest-forbidden: true
      responses:
        '204': { description: ok }
        '403': { description: invalid token gives 403 here }
  /items/no-docs:
    get:
      tags: [Item]
      operationId: noAuthDocs
      x-apitest-forbidden: true
      responses: { '200': { description: ok } }
  /items/optional:
    get:
      tags: [Item]
      operationId: optionalAuth
      security: [{ bearer: [] }, {}]
      responses: { '200': { description: ok }, '401': { description: bad token } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
