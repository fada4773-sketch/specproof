openapi: 3.0.3
info:
  title: Starport crew
  version: "1.0"
paths:
  /Dock:
    get:
      operationId: GetDocks
      tags: [Dock]
      responses:
        "200":
          description: docks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DockRead"
    post:
      operationId: CreateDock
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DockCreate"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockRead"
  /Dock/id/{id}:
    delete:
      operationId: DeleteDock
      tags: [Dock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
  /Dock/pilot/id/{id}:
    get:
      operationId: GetDockPilot
      tags: [Dock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the pilot of a dock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotRead"
  /Crew:
    get:
      operationId: GetCrew
      tags: [Crew]
      responses:
        "200":
          description: every crew member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrewRead"
components:
  schemas:
    DockRead:
      type: object
      required: [id, dockCode]
      properties:
        id: {type: integer}
        dockCode: {type: string}
        name: {type: string}
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewRead"
    DockCreate:
      type: object
      required: [dockCode]
      properties:
        dockCode: {type: string}
        name: {type: string}
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewCreate"
    CrewRead:
      type: object
      properties:
        id: {type: integer}
        dockId: {type: integer}
        name: {type: string}
    CrewCreate:
      type: object
      properties:
        name: {type: string}
    PilotRead:
      type: object
      properties:
        PilotCode: {type: string}
