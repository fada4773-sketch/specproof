openapi: 3.0.3
info:
  title: Starport roster
  version: "1.0"
paths:
  /pilots:
    post:
      operationId: createPilot
      tags: [Pilot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pilot"
      responses:
        "201":
          description: created, no body
    get:
      operationId: listPilots
      tags: [Pilot]
      responses:
        "200":
          description: all pilots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pilot"
  /pilots/{pilotCode}:
    get:
      operationId: getPilot
      tags: [Pilot]
      parameters:
        - name: pilotCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^P[0-9]{3}$"
      responses:
        "200":
          description: the pilot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pilot"
  /missions:
    post:
      operationId: createMission
      tags: [Mission]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionWrite"
      responses:
        "201":
          description: the mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
    get:
      operationId: listMissions
      tags: [Mission]
      parameters:
        - name: pilotCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the missions of a pilot
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mission"
components:
  schemas:
    Pilot:
      type: object
      required: [pilotCode, name]
      properties:
        pilotCode:
          type: string
          pattern: "^P[0-9]{3}$"
        name:
          type: string
    MissionWrite:
      type: object
      required: [pilotCode, title]
      properties:
        pilotCode:
          type: string
        title:
          type: string
    Mission:
      allOf:
        - $ref: "#/components/schemas/MissionWrite"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
