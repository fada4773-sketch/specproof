openapi: 3.0.3
info: {title: Starport, version: 1.0.0}
paths:
  /ships:
    post:
      operationId: createShip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipInput'}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ship'}
    get:
      operationId: listShips
      responses:
        '200':
          description: the ships
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Ship'}
  /ships/import:
    post:
      operationId: importShip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipInput'}
      responses:
        '201':
          description: imported
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ship'}
  /ships/{shipId}:
    parameters:
      - {name: shipId, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getShip
      responses:
        '200':
          description: the ship
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ship'}
        '404': {description: unknown}
    delete:
      operationId: deleteShip
      responses:
        '204': {description: deleted}
  /ships/{shipId}/launch:
    post:
      operationId: launchShip
      parameters:
        - {name: shipId, in: path, required: true, schema: {type: integer}}
      responses:
        default: {description: launched}
  /docks/{dockCode}:
    get:
      operationId: getDock
      parameters:
        - {name: dockCode, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: the dock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dock'}
  /planets/{planetId}:
    delete:
      operationId: deletePlanet
      parameters:
        - {name: planetId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: deleted}
components:
  schemas:
    ShipInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
    Ship:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string}
    Dock:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
