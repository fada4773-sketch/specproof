openapi: 3.0.3
info:
  title: Starport
  version: "1.0"
paths:
  /docks:
    post:
      operationId: createDock
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DockWrite"
      responses:
        "201":
          $ref: "#/components/responses/Dock"
    get:
      operationId: listDocks
      tags: [Dock]
      responses:
        "200":
          description: all docks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dock"
  /docks/{dockId}:
    parameters:
      - $ref: "#/components/parameters/DockId"
    get:
      operationId: getDock
      tags: [Dock]
      responses:
        "200":
          $ref: "#/components/responses/Dock"
    put:
      operationId: updateDock
      tags: [Dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DockWrite"
      responses:
        "200":
          $ref: "#/components/responses/Dock"
    delete:
      operationId: deleteDock
      tags: [Dock]
      responses:
        "204":
          description: deleted
  /ships:
    post:
      operationId: createShip
      tags: [Ship]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipWrite"
      responses:
        "201":
          description: the ship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
  /ships/{shipId}:
    get:
      operationId: getShip
      tags: [Ship]
      parameters:
        - name: shipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the ship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
  /bookings:
    post:
      operationId: createBooking
      tags: [Booking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: the booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [Booking]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
components:
  parameters:
    DockId:
      name: dockId
      in: path
      required: true
      schema:
        type: integer
  responses:
    Dock:
      description: the dock
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Dock"
  schemas:
    DockWrite:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          maxLength: 40
        capacity:
          type: integer
          minimum: 1
          maximum: 20
    Dock:
      allOf:
        - $ref: "#/components/schemas/DockWrite"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    ShipWrite:
      type: object
      required: [name, dockId]
      properties:
        name:
          type: string
        dockId:
          type: integer
    Ship:
      allOf:
        - $ref: "#/components/schemas/ShipWrite"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    BookingBase:
      type: object
      required: [shipId, route]
      properties:
        shipId:
          type: integer
        route:
          $ref: "#/components/schemas/Route"
    BookingCreate:
      allOf:
        - $ref: "#/components/schemas/BookingBase"
        - type: object
          properties:
            crew:
              type: array
              items:
                $ref: "#/components/schemas/CrewMember"
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingCreate"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: integer
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
    Route:
      type: object
      required: [originDockId, departure]
      properties:
        originDockId:
          type: integer
        departure:
          type: string
          format: date-time
    CrewMember:
      type: object
      required: [pilotName, role]
      properties:
        pilotName:
          type: string
        role:
          type: string
          enum: [CAPTAIN, NAVIGATOR]
