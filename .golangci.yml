version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
    - unconvert
  settings:
    staticcheck:
      # Defaults plus ST1005: some error messages start with a capitalized
      # identifier ("Config.Token missing: ...").
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    presets: [comments, std-error-handling]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable: [gofmt, goimports]
